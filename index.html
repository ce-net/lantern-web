<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Lantern</title>
<link rel="stylesheet" href="style.css">
<h1>Lantern</h1>
<p class="sub">What's on in the neighbourhood</p>
<form id="new-event">
  <h2>Add an event</h2>
  <input name="title" placeholder="What" required maxlength="120">
  <input name="when" type="datetime-local" required>
  <input name="where" placeholder="Where" required maxlength="120">
  <textarea name="description" placeholder="Details (optional)" rows="2" maxlength="1000"></textarea>
  <button>Add event</button>
</form>
<p id="status" role="status"></p>
<ul id="events"></ul>
<script src="app.js"></script>
